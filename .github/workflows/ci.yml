name: CI Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  quality:
    name: Code Quality & Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint with Ruff
        run: |
          ruff check src/ api/ tests/ streamlit_app/

      - name: Format check with Ruff
        run: |
          ruff format --check src/ api/ tests/ streamlit_app/

      - name: Run tests
        run: |
          python -m pytest tests/ -v -m "not slow" --tb=short --cov=src --cov=api --cov-report=term-missing

      - name: Check coverage threshold
        run: |
          python -m pytest tests/ -m "not slow" --cov=src --cov=api --cov-fail-under=50 -q
